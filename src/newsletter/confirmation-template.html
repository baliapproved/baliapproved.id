<style>
  .ba-email {
    color: #0c0a09;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .ba-email h1 {
    margin: 24px 0 16px;
    color: #0c0a09;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.6px;
    line-height: 1.2;
  }
  .ba-email p {
    margin: 0 0 16px;
  }
  .ba-email img {
    max-width: 100%;
    height: auto;
    border: 0;
  }
  .ba-email a {
    color: #1d1816;
  }
  .ba-email .ck-button {
    background-color: #1d1816;
    border: 1px solid #1d1816;
    border-radius: 10px;
    color: #ffffff;
    display: inline-block;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    text-align: center;
    text-decoration: none;
  }
  .ba-footer a {
    color: #7c6d67;
    text-decoration: underline;
  }
  @media only screen and (max-width: 480px) {
    .ba-email h1 {
      font-size: 26px !important;
    }
    .ba-padding {
      padding: 32px 20px !important;
    }
  }
</style>
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  bgcolor="#ffffff"
>
  <tr>
    <td align="center">
      <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="max-width: 560px"
      >
        <tr>
          <td class="ba-padding" style="padding: 40px 28px">
            <div
              class="ba-email"
              style="
                color: #0c0a09;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 16px;
                line-height: 1.6;
              "
            >
              {{ message_content }}
            </div>
            <div
              class="ba-footer"
              style="
                margin-top: 32px;
                color: #7c6d67;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 12px;
                line-height: 1.6;
                text-align: center;
              "
            >
              <a
                href="{{ unsubscribe_url }}"
                style="color: #7c6d67; text-decoration: underline"
                >Unsubscribe</a
              >
              &nbsp;·&nbsp;
              <a
                href="{{ subscriber_preferences_url }}"
                style="color: #7c6d67; text-decoration: underline"
                >Update your profile</a
              >
              <br />
              {{ address }}
            </div>
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
