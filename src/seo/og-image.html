<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Bali Approved share image · 1200 × 630</title>
  <style>
    @font-face {
      font-family: 'Instrument Sans';
      src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2');
      font-weight: 400 700;
    }

    * {
      box-sizing: border-box;
    }
    body {
      position: relative;
      width: 1200px;
      height: 630px;
      margin: 0;
      padding: 48px 64px;
      overflow: hidden;
      background: #e8e4e3;
      color: #0c0a09;
      font-family: 'Instrument Sans', sans-serif;
    }
    .texture {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      mask-image: linear-gradient(#000, #0003);
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(135deg, #cfe7d9, #e8e4e3 75%);
    }
    .seal {
      width: 84px;
      height: 84px;
      padding: 9px;
      border-radius: 50%;
      background: #005f43;
    }
    h1 {
      position: absolute;
      left: 64px;
      top: 167px;
      margin: 0;
      font-size: 72px;
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -3px;
    }
    .mark {
      position: absolute;
      right: 58px;
      top: 166px;
      width: 302px;
      height: 302px;
    }
    footer {
      position: absolute;
      inset: auto 64px 48px;
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -0.4px;
    }
  </style>
  <body>
    <img class="texture" src="../hero/assets/paint-texture-green.webp" alt="" />
    <img class="seal" src="../site/assets/bali-approved.png" alt="Bali Approved seal" />
    <h1>Bali places we’ve<br />tried ourselves,<br />rated honestly</h1>
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <defs>
        <path id="petal" d="M32 30C18 29 11 25 12 17C13 9 22 5 29 11C34 15 35 22 32 30Z" />
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#2cd88a" />
          <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2cd88a" flood-opacity="0.7" />
        </filter>
      </defs>
      <g fill="#000" stroke="#42e89a" stroke-width="0.8" filter="url(#glow)">
        <use href="#petal" />
        <use href="#petal" transform="rotate(90 32 32)" />
        <use href="#petal" transform="rotate(180 32 32)" />
        <use href="#petal" transform="rotate(270 32 32)" />
      </g>
    </svg>
    <footer>baliapproved.id</footer>
  </body>
</html>
